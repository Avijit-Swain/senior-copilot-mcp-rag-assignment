<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Alarm Investigation and Procedure Guidance Copilot" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Alarm Investigation Copilot</title>
    <script>
      // Applied before first paint so the shell never flashes the wrong theme.
      const stored = localStorage.getItem('aic.theme')
      const system = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
      document.documentElement.dataset.theme = stored ?? system
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
